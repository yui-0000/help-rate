<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>応募の確認 - おらほの助っ人けっぱれーと</title>
</head>
<body>
    <p><a href="{{ url_for('post_detail', post_id=post.id) }}" style="text-decoration: none; font-size: 16px;">⬅️ 案件詳細に戻る</a></p>

    <h1>お手伝い応募の確認</h1>

    <div style="border: 1px solid #ccc; padding: 20px; width: 60%; background-color: #fafafa; margin-bottom: 20px;">
        <h3>{{ post.title }}</h3>
        <p><strong>実施希望日時:</strong> {{ post.desired_date or '未設定' }}</p>
        <p><strong>作業場所:</strong> {{ post.location or '未設定' }}</p>
        <p><strong>謝礼:</strong> {{ post.reward or '未設定' }}</p>
    </div>

    <form action="{{ url_for('apply_post', post_id=post.id) }}" method="POST">
        <p>
            <strong>依頼者へのひと言メッセージ・意気込み（任意）</strong><br>
            <textarea name="helper_message" rows="4" cols="50" placeholder="例：はじめまして！当日お手伝いに伺います。よろしくお願いします。"></textarea>
        </p>

        <p style="font-weight: bold; color: #333; margin-top: 20px;">
            上記の内容でお手伝いに応募（決定）しますか？
        </p>

        <button type="submit" style="background-color: #4CAF50; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px;">✅ はい、応募する</button>
        <a href="{{ url_for('post_detail', post_id=post.id) }}" style="background-color: #aaa; color: white; text-decoration: none; padding: 11px 20px; border-radius: 4px; font-size: 16px; font-weight: bold;">いいえ（戻る）</a>
    </form>
</body>
</html>
