<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>応募の確認 - おらほの助っ人けっぱれーと</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/apply_confirm.css') }}">
</head>
<body>
    <p><a href="{{ url_for('post_detail', post_id=post.id) }}" class="back-link">⬅️ 案件詳細に戻る</a></p>

    <h1>お手伝い応募の確認</h1>

    <div class="post-summary">
        <h3>{{ post.title }}</h3>
        <p><strong>実施希望日時:</strong> {{ post.desired_date or '未設定' }}</p>
        <p><strong>作業場所:</strong> {{ post.location or '未設定' }}</p>
        <p><strong>謝礼:</strong> {{ post.reward or '未設定' }}</p>
    </div>

    <form action="{{ url_for('apply_post', post_id=post.id) }}" method="POST">
        <p>
            <strong>依頼者へのひと言メッセージ・意気込み（任意）</strong><br>
            <textarea name="helper_message" rows="4" cols="50" placeholder="例：はじめまして！当日お手伝いに伺います。よろしくお願いします。"></textarea>
        </p>

        <p class="confirmation-text">
            上記の内容でお手伝いに応募し、依頼者とチャットで相談しますか？住所・連絡先は、相談後に依頼者が助っ人を確定して公開するまで表示されません。
        </p>

        <button type="submit" class="confirm-button">✅ はい、応募する</button>
        <a href="{{ url_for('post_detail', post_id=post.id) }}" class="cancel-link">いいえ（戻る）</a>
    </form>
</body>
</html>
