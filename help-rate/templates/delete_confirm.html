<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>削除の確認 - おらほの助っ人けっぱれーと</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/delete_confirm.css') }}">
</head>
<body>
    <!-- ヘルプ：ホームに戻るリンク -->
    <p><a href="{{ url_for('index') }}" class="back-link">🏠 ホーム画面に戻る</a></p>

    <h1>削除の確認</h1>
    <p>本当に以下の案件を削除してもよろしいですか？この操作は取り消せません。</p>

    <div class="post-summary">
        <h3>{{ post.title }}</h3>
        <p>{{ post.content }}</p>
        {% if post.image_path %}
            <p><img src="{{ url_for('uploaded_file', filename=post.image_path) }}" alt="現場写真" width="200"></p>
        {% endif %}
        <small>投稿日時: {{ post.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
    </div>

    <!-- 削除を実行するボタン -->
    <form action="{{ url_for('delete_post', post_id=post.id) }}" method="POST" class="delete-form">
        <button type="submit" class="confirm-button">はい、削除します</button>
    </form>

    <!-- キャンセルして一覧に戻るリンク -->
    <a href="{{ url_for('index') }}" class="cancel-link">いいえ、戻ります</a>
</body>
</html>
